<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FlipAlb</title>
  <style>
    :root{
      --bg1:#060B16;
      --bg2:#0B1220;
      --glass: rgba(255,255,255,.08);
      --stroke: rgba(255,255,255,.14);
      --text: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.72);
    }

    html, body { height: 100%; margin: 0; }
    body{
      background: radial-gradient(1000px 600px at 60% 30%, #15204a 0%, var(--bg2) 40%, var(--bg1) 100%);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      overflow: hidden;
      display: grid;
      place-items: center;
    }

    /* subtle moving grain / glow */
    .bgglow{
      position: fixed; inset: -20%;
      background:
        radial-gradient(700px 400px at 20% 20%, rgba(120,160,255,.22), transparent 60%),
        radial-gradient(800px 500px at 80% 70%, rgba(255,190,120,.12), transparent 55%);
      filter: blur(20px);
      opacity: .8;
      animation: drift 7s ease-in-out infinite alternate;
      pointer-events:none;
    }
    @keyframes drift{
      from{ transform: translate3d(-10px, -8px, 0) scale(1.02); }
      to  { transform: translate3d(12px, 10px, 0) scale(1.06); }
    }

    .wrap{
      width: min(520px, 92vw);
      text-align: center;
      position: relative;
      z-index: 2;
    }

    /* CARD */
    .card{
      border: 1px solid var(--stroke);
      background: rgba(255,255,255,.06);
      border-radius: 28px;
      box-shadow: 0 24px 80px rgba(0,0,0,.45);
      padding: 28px 22px 22px;
      backdrop-filter: blur(8px);
    }

    /* THE HOUSE STAGE */
    .stage{
      width: 320px;
      height: 320px;
      margin: 4px auto 12px;
      position: relative;
      display: grid;
      place-items: center;
    }

    /* flip + settle */
    .house{
      width: 260px;
      height: 260px;
      position: relative;
      transform-style: preserve-3d;
      transform-origin: center;
      animation: flip 2.6s ease-in-out forwards;
    }
    @keyframes flip{
      0%   { transform: rotateY(0deg) scale(.94); opacity: 0; filter: blur(1px); }
      20%  { opacity: 1; }
      50%  { transform: rotateY(180deg) scale(1.02); filter: blur(0px); }
      100% { transform: rotateY(360deg) scale(1.00); }
    }

    /* BEFORE + AFTER “skins” (overlay panels) */
    .skin{
      position: absolute;
      inset: 0;
      border-radius: 26px;
      box-shadow: 0 14px 50px rgba(0,0,0,.35);
    }

    /* Bad/abandoned look */
    .before{
      background: linear-gradient(180deg, rgba(255,255,255,.09), rgba(255,255,255,.03));
      border: 1px solid rgba(255,255,255,.12);
      filter: grayscale(1) brightness(.78) contrast(1.05);
      opacity: 1;
      animation: beforeFade 2.6s ease-in-out forwards;
    }
    @keyframes beforeFade{
      0%{ opacity: 1; }
      55%{ opacity: .62; }
      100%{ opacity: .12; }
    }

    /* Nice/rehabbed look */
    .after{
      background: linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,.06));
      border: 1px solid rgba(255,255,255,.18);
      opacity: 0;
      transform: scale(.94);
      animation: afterPop 2.6s ease-in-out forwards;
    }
    @keyframes afterPop{
      0%{ opacity: 0; transform: scale(.94); }
      55%{ opacity: .35; transform: scale(1.02); }
      100%{ opacity: .96; transform: scale(1.00); }
    }

    /* roof + house body */
    .roof{
      position: absolute;
      left: 50%;
      top: 52px;
      width: 190px;
      height: 100px;
      transform: translateX(-50%);
      background: rgba(255,255,255,.22);
      clip-path: polygon(50% 0%, 100% 45%, 100% 62%, 50% 18%, 0% 62%, 0% 45%);
      opacity: .55;
      animation: roofBright 2.6s ease-in-out forwards;
    }
    @keyframes roofBright{
      0%{ opacity: .35; filter: saturate(.2); }
      60%{ opacity: .55; }
      100%{ opacity: .85; filter: saturate(1); }
    }

    .body{
      position: absolute;
      left: 50%;
      top: 120px;
      width: 200px;
      height: 130px;
      transform: translateX(-50%);
      background: rgba(255,255,255,.16);
      border-radius: 18px;
      opacity: .55;
      overflow: hidden;
      animation: bodyBright 2.6s ease-in-out forwards;
    }
    @keyframes bodyBright{
      0%{ opacity: .35; filter: saturate(.1); }
      55%{ opacity: .55; }
      100%{ opacity: .9; filter: saturate(1); }
    }

    /* paint sweep effect */
    .paint{
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg,
        rgba(180,220,255,.0),
        rgba(180,220,255,.0) 35%,
        rgba(180,220,255,.25) 55%,
        rgba(180,220,255,.0) 75%,
        rgba(180,220,255,.0)
      );
      transform: translateX(-120%);
      animation: paintSweep 2.6s ease-in-out forwards;
    }
    @keyframes paintSweep{
      0%{ transform: translateX(-120%); opacity: 0; }
      40%{ opacity: 0; }
      55%{ opacity: 1; }
      100%{ transform: translateX(120%); opacity: 0; }
    }

    /* grime cracks */
    .grime{
      position: absolute;
      inset: 0;
      background:
        radial-gradient(40px 32px at 25% 35%, rgba(0,0,0,.22), transparent 60%),
        radial-gradient(55px 40px at 70% 55%, rgba(0,0,0,.18), transparent 60%),
        linear-gradient(135deg, transparent 35%, rgba(0,0,0,.12) 35%, transparent 36%),
        linear-gradient(225deg, transparent 55%, rgba(0,0,0,.10) 55%, transparent 56%);
      opacity: .9;
      animation: grimeAway 2.6s ease-in-out forwards;
      pointer-events:none;
    }
    @keyframes grimeAway{
      0%{ opacity: .9; filter: blur(0px); }
      55%{ opacity: .45; }
      100%{ opacity: 0; filter: blur(1px); }
    }

    /* windows + door */
    .window{
      position: absolute;
      width: 40px;
      height: 40px;
      border-radius: 10px;
      top: 34px;
      background: rgba(0,0,0,.34); /* “boarded/dark” */
      box-shadow: inset 0 0 0 2px rgba(255,255,255,.10);
      animation: windowLife 2.6s ease-in-out forwards;
    }
    .w1{ left: 30px; }
    .w2{ right: 30px; }

    @keyframes windowLife{
      0%{ background: rgba(0,0,0,.38); }
      55%{ background: rgba(0,0,0,.22); }
      100%{ background: rgba(255,255,255,.60); box-shadow: 0 0 18px rgba(180,220,255,.25), inset 0 0 0 2px rgba(255,255,255,.12); }
    }

    .door{
      position: absolute;
      width: 44px;
      height: 72px;
      border-radius: 14px;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,.34);
      box-shadow: inset 0 0 0 2px rgba(255,255,255,.10);
      animation: doorLife 2.6s ease-in-out forwards;
    }
    @keyframes doorLife{
      0%{ background: rgba(0,0,0,.36); }
      55%{ background: rgba(0,0,0,.22); }
      100%{ background: rgba(255,255,255,.48); box-shadow: inset 0 0 0 2px rgba(255,255,255,.12); }
    }

    /* yard transforms */
    .yard{
      position: absolute;
      left: 50%;
      bottom: 18px;
      width: 220px;
      height: 30px;
      transform: translateX(-50%);
      border-radius: 999px;
      background: rgba(0,0,0,.18);
      opacity: .8;
      animation: yardGreen 2.6s ease-in-out forwards;
    }
    @keyframes yardGreen{
      0%{ background: rgba(0,0,0,.18); opacity:.85; }
      55%{ opacity:.65; }
      100%{ background: rgba(130,220,140,.25); opacity:.9; }
    }

    /* title reveal */
    .brand{
      margin-top: 10px;
      animation: brandIn .9s ease forwards;
      animation-delay: 1.35s;
      opacity: 0;
      transform: translateY(8px);
    }
    @keyframes brandIn{
      to{ opacity: 1; transform: translateY(0); }
    }
    h1{
      font-size: 28px;
      margin: 0;
      letter-spacing: .2px;
    }
    .tag{
      margin: 8px 0 0;
      font-size: 14px;
      color: var(--muted);
    }

    /* bottom progress dots */
    .dots{
      display:flex;
      justify-content:center;
      gap:8px;
      margin-top: 16px;
      opacity:.75;
    }
    .dot{
      width: 8px; height: 8px;
      border-radius: 999px;
      background: rgba(255,255,255,.25);
      overflow:hidden;
      position:relative;
    }
    .dot::after{
      content:"";
      position:absolute; inset:0;
      background: rgba(255,255,255,.65);
      transform: translateX(-110%);
      animation: dotMove 2.6s ease forwards;
    }
    .dot:nth-child(2)::after{ animation-delay: .08s; }
    .dot:nth-child(3)::after{ animation-delay: .16s; }
    @keyframes dotMove{
      0%{ transform: translateX(-110%); opacity: 0; }
      25%{ opacity: 1; }
      100%{ transform: translateX(110%); opacity: 0; }
    }

    /* skip button */
    .skip{
      position: fixed;
      top: 14px;
      right: 14px;
      padding: 9px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(255,255,255,.07);
      color: #fff;
      cursor: pointer;
      opacity: 0;
      animation: showSkip .6s ease forwards;
      animation-delay: .9s;
      z-index: 5;
    }
    @keyframes showSkip{ to{ opacity: 1; } }

    /* small footer */
    .hint{
      margin-top: 10px;
      font-size: 12px;
      opacity: .6;
    }
  </style>
</head>

<body>
  <div class="bgglow"></div>

  <button class="skip" onclick="goNext()">Skip</button>

  <div class="wrap">
    <div class="card">
      <div class="stage">
        <div class="house" aria-label="House flipping animation">
          <div class="skin before"></div>
          <div class="skin after"></div>

          <div class="roof"></div>

          <div class="body">
            <div class="paint"></div>
            <div class="grime"></div>
            <div class="window w1"></div>
            <div class="window w2"></div>
            <div class="door"></div>
          </div>

          <div class="yard"></div>
        </div>
      </div>

      <div class="brand">
        <h1>FlipAlb</h1>
        <p class="tag">Turning vacant houses into homes.</p>
        <div class="dots" aria-hidden="true">
          <div class="dot"></div><div class="dot"></div><div class="dot"></div>
        </div>
        <div class="hint">Loading map…</div>
      </div>
    </div>
  </div>

  <script>
    // Change this if your map route differs
    const NEXT_URL = "/map";

    function goNext() {
      window.location.href = NEXT_URL;
    }

    // Auto-redirect after animation finishes
    setTimeout(goNext, 2850);
  </script>
</body>
</html>
