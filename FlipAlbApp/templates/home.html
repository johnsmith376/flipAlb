<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FlipALB</title>

  <style>
    :root{
      --dur: 7s;
      --ease: cubic-bezier(.2,.9,.2,1);

      --stageW: 560px;
      --stageH: 460px;

      --groundLineY: 340px;

      --ink: rgba(255,255,255,.94);
      --muted: rgba(255,255,255,.72);
    }

    html, body { height:100%; margin:0; }

    body{
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      overflow:hidden;
      display:grid;
      place-items:center;
      color: var(--ink);
      background: #070A14; 
    }

    .bgDark, .bgLight{
      position: fixed;
      inset: 0;
      z-index: -5;
      pointer-events: none;
    }

    .bgDark{
      background: radial-gradient(1200px 800px at 60% 25%, #1c2f6a 0%, #0B1220 48%, #070A14 100%);
    }

    .bgLight{
      background: radial-gradient(1400px 900px at 60% 25%, #def6ff 0%, #86d0ff 45%, #2f77df 100%);
      opacity: 0;
      animation: bgLightFade var(--dur) var(--ease) forwards;
    }

    @keyframes bgLightFade{
      0%, 44% { opacity: 0; }
      78%     { opacity: 1; }
      100%    { opacity: 1; }
    }

    .clouds{
      position: fixed; inset: 0;
      pointer-events:none;
      opacity: 0;
      animation: cloudsIn var(--dur) var(--ease) forwards;
      z-index: -2;
    }
    @keyframes cloudsIn{
      0%, 48%{ opacity:0; transform: translateY(-10px); }
      60%{ opacity:.35; transform: translateY(-4px); }
      72%{ opacity:.75; transform: translateY(0); }
      100%{ opacity:1; transform: translateY(0); }
    }

    .cloud{
      position:absolute;
      background: rgba(255,255,255,.78);
      border-radius: 999px;
      filter: blur(.2px);
    }
    .cloud::before, .cloud::after{
      content:"";
      position:absolute;
      background: rgba(255,255,255,.82);
      border-radius: 999px;
    }
    .c1{ width: 220px; height: 62px; left: 10%; top: 14%; opacity:.85; }
    .c2{ width: 280px; height: 78px; right: 12%; top: 18%; opacity:.78; }
    .c3{ width: 170px; height: 54px; left: 52%; top: 10%; opacity:.70; }
    .cloud::before{ width: 80px; height: 80px; left: 30px; top: -24px; }
    .cloud::after { width: 110px; height: 110px; right: 26px; top: -44px; opacity:.92; }

    .stage{
      width: min(var(--stageW), 94vw);
      height: min(var(--stageH), 70vh);
      position: relative;
    }

    .groundLine{
      position:absolute;
      left: 50%;
      top: var(--groundLineY);
      width: min(760px, 96vw);
      height: 2px;
      transform: translateX(-50%);
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.22), transparent);
      opacity: .7;
    }

    .mask{
      position:absolute;
      left: 50%;
      top: 0;
      width: 720px;
      height: var(--groundLineY);
      transform: translateX(-50%);
      overflow: hidden;
      pointer-events: none;
    }

    .houseLayer{
      position:absolute;
      left: 50%;
      top: 0;
      width: 900px;
      height: var(--groundLineY);
      transform: translateX(-50%);
    }

    .houseSprite{
      position:absolute;
      left: 50%;
      bottom: 0;
      width: 380px;
      height: 380px;
      transform-origin: 50% 92%;
      will-change: transform, opacity;
      transform: translateZ(0);
    }

    .houseSprite, .houseSprite svg{
      background: transparent !important;
      outline: none !important;
      border: none !important;
      box-shadow: none !important;
      filter: none !important;
    }
    .houseSprite svg{
      width: 100%;
      height: 100%;
      display:block;
      overflow: visible;
    }

    .uglyAnim{
      opacity: 1;
      animation: uglyDown var(--dur) var(--ease) forwards;
    }
    @keyframes uglyDown{
      0%   { transform: translateX(-50%) translateY(0px) rotate(0deg); opacity:1; }
      25%  { transform: translateX(-50%) translateY(0px) rotate(0deg); opacity:1; }

      45%  { transform: translateX(calc(-50% + 140px)) translateY(150px) rotate(110deg); opacity:1; }

      55%  { transform: translateX(calc(-50% + 180px)) translateY(220px) rotate(150deg); opacity:0; }
      100% { transform: translateX(calc(-50% + 180px)) translateY(220px) rotate(150deg); opacity:0; }
    }

    .niceAnim{
      opacity: 0;
      animation: niceUp var(--dur) var(--ease) forwards;
    }

    @keyframes niceUp{
      0%{
        transform: translateX(calc(-50% - 180px)) translateY(240px) rotate(-150deg);
        opacity: 0;
      }
      38%{
        transform: translateX(calc(-50% - 180px)) translateY(240px) rotate(-150deg);
        opacity: 0;
      }
      42%{
        transform: translateX(calc(-50% - 175px)) translateY(230px) rotate(-145deg);
        opacity: 0.02;
      }
      46%{
        transform: translateX(calc(-50% - 165px)) translateY(205px) rotate(-130deg);
        opacity: 0.35;
      }
      52%{
        transform: translateX(calc(-50% - 145px)) translateY(150px) rotate(-110deg);
        opacity: 0.85;
      }
      62%{
        transform: translateX(-50%) translateY(0px) rotate(0deg);
        opacity: 1;
      }
      100%{
        transform: translateX(-50%) translateY(0px) rotate(0deg);
        opacity: 1;
      }
    }

    .brand{
      position: absolute;
      left: 50%;
      top: calc(var(--groundLineY) + 24px);
      transform: translateX(-50%);
      text-align:center;
      opacity: 0;
      animation: brandIn var(--dur) var(--ease) forwards;
      z-index: 5;
    }
    @keyframes brandIn{
      0%, 60%{ opacity:0; transform: translateX(-50%) translateY(10px); }
      75%{ opacity:1; transform: translateX(-50%) translateY(0); }
      100%{ opacity:1; transform: translateX(-50%) translateY(0); }
    }

    .name{
      margin:0;
      font-size: 44px;
      font-weight: 900;
      letter-spacing: .8px;
      text-shadow: 0 12px 34px rgba(0,0,0,.35);
    }
    .name .thin{ font-weight: 700; opacity:.92; }
    .tag{
      margin: 8px 0 0;
      font-size: 14px;
      color: var(--muted);
    }

    .cta{
      position: absolute;
      left: 50%;
      top: calc(var(--groundLineY) + 110px);
      transform: translateX(-50%);
      display: inline-flex;
      align-items: center;
      gap: 10px;

      padding: 12px 18px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.22);
      background: rgba(255,255,255,.10);
      color: rgba(255,255,255,.95);
      text-decoration: none;
      font-weight: 800;
      letter-spacing: .2px;

      backdrop-filter: blur(10px);
      box-shadow: 0 14px 40px rgba(0,0,0,.25);

      opacity: 0;
      animation: ctaIn var(--dur) var(--ease) forwards;
      z-index: 6;
    }

    .cta:hover{
      background: rgba(255,255,255,.16);
      transform: translateX(-50%) scale(1.03);
    }
    .cta:active{
      transform: translateX(-50%) scale(.98);
    }

    @keyframes ctaIn{
      0%, 70% { opacity: 0; transform: translateX(-50%) translateY(10px); }
      82%     { opacity: 1; transform: translateX(-50%) translateY(0); }
      100%    { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    @media (prefers-reduced-motion: reduce){
      .clouds, .uglyAnim, .niceAnim, .brand, .bgLight, .cta { animation:none !important; }
      .bgLight{ opacity:1 !important; }
      .uglyAnim{ opacity:0 !important; }
      .niceAnim{ opacity:1 !important; transform: translateX(-50%) translateY(0) rotate(0deg) !important; }
      .brand, .cta{ opacity:1 !important; transform: translateX(-50%) translateY(0) !important; }
    }
  </style>
</head>

<body>
  <div class="bgDark"></div>
  <div class="bgLight"></div>

  <div class="clouds" aria-hidden="true">
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="cloud c3"></div>
  </div>

  <div class="stage" aria-label="House flip splash">

    <div class="mask">
      <div class="houseLayer">

        <div class="houseSprite uglyAnim" aria-hidden="true">
          <svg viewBox="0 0 320 320" role="img" aria-label="Ugly house illustration">
            <defs>
              <linearGradient id="uRoof" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#5b5b61"/>
                <stop offset="1" stop-color="#2e2e34"/>
              </linearGradient>
              <linearGradient id="uWall" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#b8b3ad"/>
                <stop offset="1" stop-color="#8c8884"/>
              </linearGradient>
            </defs>

            <path d="M66 286 C110 266, 210 266, 254 286 C212 302, 108 302, 66 286Z"
                  fill="#4b3f2f" opacity=".55"/>

            <path d="M92 150 L228 150 L240 276 Q160 296 80 276 Z"
                  fill="url(#uWall)"/>

            <path d="M78 162 L160 92 L242 162 L228 174 L160 126 L92 174 Z"
                  fill="url(#uRoof)"/>

            <rect x="204" y="108" width="22" height="52" rx="7" fill="#44454c"/>
            <rect x="200" y="104" width="30" height="12" rx="6" fill="#2b2c31"/>

            <path d="M184 158 L242 158 L242 216 Q214 224 184 216 Z" fill="#8c8884" opacity=".55"/>
            <circle cx="216" cy="180" r="15" fill="#1a1b22" opacity=".65"/>
            <circle cx="216" cy="180" r="15" fill="none" stroke="#ffffff" stroke-opacity=".18" stroke-width="5"/>

            <rect x="108" y="178" width="76" height="64" rx="14" fill="#0f1016" opacity=".70"/>
            <rect x="108" y="178" width="76" height="64" rx="14" fill="none" stroke="#ffffff" stroke-opacity=".16" stroke-width="7"/>
            <path d="M118 202 H178" stroke="#6b5a3e" stroke-width="10" stroke-linecap="round" opacity=".92"/>
            <path d="M120 220 H180" stroke="#6b5a3e" stroke-width="10" stroke-linecap="round" opacity=".85"/>

            <path d="M186 224 L242 224 L232 240 L196 240 Z" fill="#3b3b42" opacity=".65"/>

            <rect x="206" y="238" width="32" height="58" rx="12" fill="#151622" opacity=".80"/>
            <circle cx="234" cy="266" r="3" fill="#ffffff" opacity=".25"/>

            <g opacity=".18">
              <ellipse cx="118" cy="188" rx="28" ry="18" fill="#000"/>
              <ellipse cx="206" cy="214" rx="30" ry="20" fill="#000"/>
              <ellipse cx="154" cy="240" rx="40" ry="18" fill="#000"/>
              <path d="M104 170 C120 184, 112 206, 126 224"
                    stroke="#000" stroke-width="3" fill="none" stroke-linecap="round"/>
              <path d="M218 170 C200 188, 212 206, 194 228"
                    stroke="#000" stroke-width="3" fill="none" stroke-linecap="round"/>
            </g>
          </svg>
        </div>

        <div class="houseSprite niceAnim">
          <svg viewBox="0 0 320 320" role="img" aria-label="Nice house illustration">
            <defs>
              <linearGradient id="nRoof" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#ff6a6a"/>
                <stop offset="1" stop-color="#d8334c"/>
              </linearGradient>
              <linearGradient id="nWall" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#ffb36b"/>
                <stop offset="1" stop-color="#f07b4b"/>
              </linearGradient>
              <linearGradient id="nSide" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#ffd3a4"/>
                <stop offset="1" stop-color="#ff9a63"/>
              </linearGradient>
              <linearGradient id="nTrim" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#ffffff"/>
                <stop offset="1" stop-color="#e9f2ff"/>
              </linearGradient>
            </defs>

            <path d="M66 286 C110 266, 210 266, 254 286 C212 304, 108 304, 66 286Z"
                  fill="#34d17a" opacity=".30"/>
            <path d="M86 292 C120 276, 200 276, 234 292 C204 306, 116 306, 86 292Z"
                  fill="#2fbe64" opacity=".22"/>

            <path d="M92 150 L228 150 L240 276 Q160 296 80 276 Z"
                  fill="url(#nWall)"/>

            <path d="M78 162 L160 92 L242 162 L228 174 L160 126 L92 174 Z"
                  fill="url(#nRoof)"/>
            <path d="M98 162 L160 112 L222 162" stroke="#ffffff" stroke-opacity=".18" stroke-width="6" stroke-linecap="round"/>

            <rect x="204" y="108" width="22" height="52" rx="7" fill="#ffd0b6" opacity=".95"/>
            <rect x="200" y="104" width="30" height="12" rx="6" fill="#d8334c" opacity=".95"/>

            <path d="M184 158 L242 158 L242 216 Q214 224 184 216 Z" fill="url(#nSide)" opacity=".95"/>

            <path d="M96 158 L224 158" stroke="url(#nTrim)" stroke-width="8" stroke-linecap="round" opacity=".95"/>

            <circle cx="216" cy="180" r="15" fill="#c6f1ff" opacity=".92"/>
            <circle cx="216" cy="180" r="15" fill="none" stroke="url(#nTrim)" stroke-width="6" opacity=".95"/>
            <path d="M216 166 V194" stroke="#4aa7ff" opacity=".35" stroke-width="2"/>
            <path d="M202 180 H230" stroke="#4aa7ff" opacity=".35" stroke-width="2"/>

            <rect x="106" y="170" width="84" height="72" rx="14" fill="#e8fbff" opacity=".96"/>
            <rect x="106" y="170" width="84" height="72" rx="14" fill="none" stroke="url(#nTrim)" stroke-width="8"/>
            <path d="M148 170 V242" stroke="#4aa7ff" opacity=".30" stroke-width="2"/>
            <path d="M106 206 H190" stroke="#4aa7ff" opacity=".30" stroke-width="2"/>

            <path d="M186 224 L242 224 L232 242 L196 242 Z" fill="#ff4f64" opacity=".92"/>
            <rect x="198" y="242" width="10" height="40" rx="5" fill="url(#nTrim)" opacity=".95"/>
            <rect x="226" y="242" width="10" height="40" rx="5" fill="url(#nTrim)" opacity=".95"/>

            <rect x="206" y="238" width="32" height="58" rx="12" fill="#2b2f5c" opacity=".95"/>
            <rect x="212" y="246" width="20" height="42" rx="10" fill="#ffffff" opacity=".10"/>
            <circle cx="234" cy="266" r="3.2" fill="#ffd18b" opacity=".95"/>

            <circle cx="112" cy="280" r="14" fill="#2bd66f" opacity=".55"/>
            <circle cx="128" cy="286" r="16" fill="#20c764" opacity=".50"/>
            <circle cx="242" cy="282" r="14" fill="#2bd66f" opacity=".55"/>
            <circle cx="226" cy="288" r="16" fill="#20c764" opacity=".50"/>
          </svg>
        </div>

      </div>
    </div>

    <div class="groundLine" aria-hidden="true"></div>

    <div class="brand">
      <h1 class="name"><span class="thin">Flip</span>ALB</h1>
      <div class="tag">Vacant → Visible → Activated.</div>
    </div>

    <a class="cta" href="/landing">Help Flip Albany →</a>

  </div>

</body>
</html>
